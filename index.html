<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8fafc">
<title>Where is Cha?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] } } } };</script>
<style>
  html, body { height: 100%; margin: 0; font-family: 'Prompt', sans-serif; background: #f1f5f9; }
  #map { position: fixed; inset: 0; z-index: 0; }
  .avatar-wrap { position: relative; width: 56px; height: 56px; }
  .avatar-wrap img, .avatar-wrap .ph {
    position: absolute; inset: 0; width: 56px; height: 56px; border-radius: 9999px;
    border: 3px solid #fff; box-shadow: 0 4px 14px rgba(0,0,0,.22); object-fit: cover;
    background: #fbcfe8; display: flex; align-items: center; justify-content: center; font-size: 26px; z-index: 2;
  }
  .pulse { position: absolute; inset: 0; border-radius: 9999px; background: rgba(244,114,182,.45); animation: pulse 2s ease-out infinite; z-index: 1; }
  .pulse.d2 { animation-delay: 1s; }
  @keyframes pulse { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(2.6); opacity: 0; } }
  .dest-pin {
    width: 36px; height: 36px; border-radius: 9999px; background: #fff; border: 2px solid #c7d2fe;
    box-shadow: 0 4px 12px rgba(0,0,0,.18); display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .chip.active { background: #1e293b; color: #fff; }
  .toggle.on { background: #fb7185 !important; color: #fff !important; }
  .sticker-pop {
    position: fixed; left: 50%; top: 42%; z-index: 2000; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; animation: pop 2.8s ease forwards;
  }
  @keyframes pop {
    0%   { transform: translate(-50%, -20%) scale(.3); opacity: 0; }
    15%  { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    25%  { transform: translate(-50%, -50%) scale(1); }
    80%  { transform: translate(-50%, -60%); opacity: 1; }
    100% { transform: translate(-50%, -110%); opacity: 0; }
  }
  .leaflet-control-attribution { font-size: 10px; }
  .map-search-ui {
    position: fixed;
    z-index: 1100;
    top: max(68px, calc(env(safe-area-inset-top) + 60px));
    left: 50%;
    transform: translateX(-50%);
    width: min(440px, calc(100vw - 24px));
  }
  .map-search-results:empty { display: none; }
  .map-search-result {
    display: flex; align-items: flex-start; gap: 10px;
    width: 100%; padding: 11px 14px; border: 0;
    border-bottom: 1px solid #f1f5f9; background: white; text-align: left; cursor: pointer;
    transition: background 0.15s;
  }
  .map-search-result:hover { background: #f8fafc; }
  .map-search-result:last-child { border-bottom: 0; }
</style>
</head>
<body>
<div id="map"></div>

<!-- Top bar + Mode Switcher -->
<div class="fixed top-0 inset-x-0 z-[1200] p-3 flex justify-between items-center pointer-events-none" style="padding-top:max(12px,env(safe-area-inset-top))">
  <div class="pointer-events-auto inline-flex items-center gap-2 bg-white/95 backdrop-blur rounded-full shadow-md px-4 py-2">
    <span class="text-base font-semibold text-slate-700">Where is Cha?</span>
    <span id="modeBadge" class="hidden text-xs bg-indigo-100 text-indigo-600 rounded-full px-2 py-0.5">คนขับ</span>
  </div>

  <div class="pointer-events-auto inline-flex bg-white/95 backdrop-blur rounded-full shadow-md p-1 text-xs">
    <button id="btnViewerMode" type="button" class="px-3 py-1.5 rounded-full font-medium bg-slate-800 text-white transition">แฟนดู</button>
    <button id="btnDriverMode" type="button" class="px-3 py-1.5 rounded-full font-medium text-slate-500 transition">คนขับ</button>
  </div>
</div>

<!-- กล่องค้นหาจุดหมายที่จะไป (พร้อมคาดการณ์สถานที่อัตโนมัติขณะพิมพ์) -->
<div id="topSearchWrapper" class="map-search-ui hidden">
  <form id="mapSearchForm" class="flex items-center gap-1.5 rounded-full bg-white/95 backdrop-blur p-1.5 shadow-lg border border-slate-100">
    <input
      id="mapSearchInput"
      type="search"
      autocomplete="off"
      placeholder="พิมพ์ชื่อสถานที่ที่จะไป เช่น ม.ทักษิณ, พัทลุง..."
      class="min-w-0 flex-1 rounded-full px-4 py-2 text-sm outline-none bg-transparent"
    >
    <button id="clearSearchBtn" type="button" class="hidden text-slate-400 hover:text-slate-600 px-2 text-sm" title="ล้างคำค้นหา">&#10005;</button>
    <button type="submit" class="rounded-full bg-indigo-500 hover:bg-indigo-600 px-4 py-2 text-sm text-white font-medium transition">ค้นหา</button>
  </form>
  <div id="mapSearchResults" class="map-search-results mt-2 max-h-64 overflow-y-auto rounded-2xl bg-white/98 backdrop-blur text-sm shadow-xl border border-slate-100"></div>
</div>

<!-- ปุ่มตำแหน่งปัจจุบัน -->
<button
  id="myLocationBtn"
  type="button"
  aria-label="แสดงตำแหน่งปัจจุบัน"
  title="แสดงตำแหน่งปัจจุบัน"
  class="fixed right-3 top-1/2 z-[1100] flex h-11 w-11 -translate-y-1/2 items-center justify-center rounded-full bg-white/95 text-lg shadow-lg border border-slate-100 active:scale-95 transition"
>&#127919;</button>

<!-- Toast -->
<div id="toast" class="hidden fixed left-1/2 -translate-x-1/2 top-32 z-[2500] bg-slate-800/90 text-white text-sm rounded-full px-4 py-2 shadow-lg max-w-[90vw] text-center"></div>

<!-- Bottom sheet -->
<div class="fixed bottom-0 inset-x-0 z-[1000] flex justify-center px-3" style="padding-bottom:max(12px,env(safe-area-inset-bottom))">
  <div class="w-full max-w-md bg-white/95 backdrop-blur rounded-3xl shadow-2xl border border-slate-100 overflow-hidden">
    <button id="handle" class="w-full pt-2.5 pb-1 flex justify-center" aria-label="ย่อ/ขยาย">
      <span class="w-10 h-1.5 rounded-full bg-slate-200"></span>
    </button>
    <div class="px-5 pb-4">
      <div class="flex items-center justify-between gap-3">
        <div class="min-w-0">
          <div id="statusText" class="text-base font-medium text-slate-700 truncate">รอข้อมูล...</div>
          <div id="updatedText" class="text-xs text-slate-400">-</div>
        </div>
        <button id="followBtn" class="shrink-0 text-xs rounded-full px-3 py-1.5 bg-pink-50 text-pink-500">ตามหมุด: เปิด</button>
      </div>

      <div id="sheetBody" class="max-h-[54vh] overflow-y-auto">
        <!-- Progress -->
        <div class="mt-3">
          <div class="flex justify-between text-xs text-slate-500 mb-1.5">
            <span id="destText" class="truncate pr-2">ยังไม่ได้ตั้งจุดหมาย</span><span id="pctText">0%</span>
          </div>
          <div class="h-2.5 rounded-full bg-slate-100 overflow-hidden">
            <div id="progressBar" class="h-full rounded-full bg-gradient-to-r from-pink-400 to-indigo-400 transition-all duration-700" style="width:0%"></div>
          </div>
          <div id="etaDetail" class="text-[11px] text-slate-400 mt-1"></div>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-3 gap-2 mt-3 text-center">
          <div class="rounded-2xl bg-slate-50 py-2"><div id="speedText" class="text-lg font-semibold text-slate-700">0</div><div class="text-[11px] text-slate-400">km/h</div></div>
          <div class="rounded-2xl bg-slate-50 py-2"><div id="remainText" class="text-lg font-semibold text-slate-700">-</div><div class="text-[11px] text-slate-400">กม. ที่เหลือ</div></div>
          <div class="rounded-2xl bg-slate-50 py-2"><div id="etaText" class="text-lg font-semibold text-slate-700">-</div><div class="text-[11px] text-slate-400">ถึงประมาณ</div></div>
        </div>

        <!-- Viewer -->
        <div id="viewerPanel" class="mt-3">
          <div class="text-xs text-slate-400 mb-1.5">ส่งกำลังใจ</div>
          <div id="stickerBtns" class="grid grid-cols-4 gap-2"></div>
        </div>

        <!-- Driver -->
        <div id="driverPanel" class="hidden mt-3 space-y-3">
          <div class="flex items-center gap-3">
            <img id="avatarPreview" alt="" class="w-11 h-11 rounded-full object-cover bg-pink-100 border-2 border-white shadow"
                 src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
            <label class="flex-1 text-center text-xs rounded-xl border border-dashed border-slate-300 py-2.5 text-slate-500 cursor-pointer hover:bg-slate-50">
              เปลี่ยนรูปอวตาร<input id="avatarInput" type="file" accept="image/*" class="hidden">
            </label>
          </div>

          <div class="flex gap-2">
            <button id="pickBtn" class="toggle flex-1 rounded-xl bg-indigo-50 text-indigo-600 text-xs font-medium py-2.5">แตะแผนที่เพื่อปักจุดหมาย</button>
            <button id="clearDestBtn" class="rounded-xl bg-slate-100 text-slate-500 text-xs px-4">ล้างจุดหมาย</button>
          </div>

          <div>
            <div class="text-xs text-slate-400 mb-1">สถานะ</div>
            <div id="statusBtns" class="grid grid-cols-3 gap-2"></div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <button id="gpsBtn" class="toggle rounded-xl bg-indigo-500 text-white text-sm py-2.5 font-medium">เริ่มแชร์ GPS</button>
            <button id="demoBtn" class="toggle rounded-xl bg-slate-100 text-slate-600 text-sm py-2.5 font-medium">ทดลองวิ่ง</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ================= CONFIG ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBOpV9UvLKSVFySYhuCUeLrIT-8OIHL9fE",
  authDomain: "where-is-cha.firebaseapp.com",
  databaseURL: "https://where-is-cha-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "where-is-cha",
  storageBucket: "where-is-cha.firebasestorage.app",
  messagingSenderId: "1007262654950",
  appId: "1:1007262654950:web:d4bc25cf1b4df5730ab627"
};
const DEFAULT_CENTER = [7.1897, 100.5954]; // สงขลา
const DEMO_DEST = { lat: 7.6166, lng: 100.0740, name: 'พัทลุง' };
const GPS_INTERVAL_MS = 3000;
const FALLBACK_SPEED = 60;
const DEMO_SECONDS = 60;

const E = { car: '\uD83D\uDE97', coffee: '\u2615', flag: '\uD83C\uDFC1', heart: '\u2764\uFE0F', pin: '\uD83D\uDCCD', person: '\uD83D\uDE4B' };
const STATUSES = [
  { text: 'กำลังเดินทาง', emoji: E.car },
  { text: 'แวะพัก', emoji: E.coffee },
  { text: 'ถึงแล้ว', emoji: E.flag }
];
const STICKERS = [
  { emoji: E.heart, text: 'คิดถึงนะ!' },
  { emoji: E.car, text: 'ขับดีๆ นะ' },
  { emoji: E.coffee, text: 'พักบ้างนะ' },
  { emoji: E.pin, text: 'ถึงแล้วบอกด้วย' }
];

/* ================= INIT ================= */
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const tripRef = db.ref('trip');
const TS = firebase.database.ServerValue.TIMESTAMP;
const $ = id => document.getElementById(id);

let serverOffset = 0;
db.ref('.info/serverTimeOffset').on('value', s => serverOffset = s.val() || 0);
const serverNow = () => Date.now() + serverOffset;

const state = { avatar: null, status: null, location: null, destination: null };
let routeCum = null, meMarker = null, destMarker = null, routeLine = null;
let followMe = true, fitted = false, avgSpeed = null;

/* ================= MAP (ไม่ใช้ API Key) ================= */
const map = L.map('map', { zoomControl: false }).setView(DEFAULT_CENTER, 11);
map.attributionControl.setPosition('bottomleft');
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  subdomains: 'abcd',
  maxZoom: 20
}).addTo(map);

/* ================= HELPERS ================= */
function toast(msg, ms = 2500) {
  const t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.add('hidden'), ms);
}
const toRad = x => x * Math.PI / 180;
function hav(a, b) {
  const R = 6371, dLat = toRad(b[0] - a[0]), dLng = toRad(b[1] - a[1]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a[0])) * Math.cos(toRad(b[0])) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function buildCum(rc) { const c = [0]; for (let i = 1; i < rc.length; i++) c.push(c[i - 1] + hav(rc[i - 1], rc[i])); return c; }
function pointAt(rc, cum, d) {
  const i = cum.findIndex(c => c >= d);
  if (i === -1) return rc[rc.length - 1];
  if (i === 0) return rc[0];
  const t = (d - cum[i - 1]) / ((cum[i] - cum[i - 1]) || 1);
  return [rc[i - 1][0] + (rc[i][0] - rc[i - 1][0]) * t, rc[i - 1][1] + (rc[i][1] - rc[i - 1][1]) * t];
}
function downsample(arr, max) {
  if (arr.length <= max) return arr;
  const step = (arr.length - 1) / (max - 1), out = [];
  for (let i = 0; i < max; i++) out.push(arr[Math.round(i * step)]);
  return out;
}
const AVATAR_RE = /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/;
const safeAvatar = s => (typeof s === 'string' && AVATAR_RE.test(s)) ? s : null;

function remainingKm(pos) {
  const d = state.destination; if (!d) return null;
  const rc = d.routeCoords;
  if (!rc || rc.length < 2 || !routeCum) return hav(pos, [d.destLat, d.destLng]);
  let best = 0, bd = Infinity;
  for (let i = 0; i < rc.length; i++) { const x = hav(pos, rc[i]); if (x < bd) { bd = x; best = i; } }
  return bd + (routeCum[routeCum.length - 1] - routeCum[best]);
}

/* ================= MARKERS ================= */
function avatarIcon() {
  const src = safeAvatar(state.avatar);
  const inner = src ? `<img src="${src}" alt="">` : `<div class="ph">${E.person}</div>`;
  return L.divIcon({ className: '', iconSize: [56, 56], iconAnchor: [28, 28],
    html: `<div class="avatar-wrap"><span class="pulse"></span><span class="pulse d2"></span>${inner}</div>` });
}
const destIcon = L.divIcon({ className: '', iconSize: [36, 36], iconAnchor: [18, 18], html: `<div class="dest-pin">${E.flag}</div>` });

function moveMarker(to) {
  const from = meMarker.getLatLng(), start = performance.now(), dur = 900;
  cancelAnimationFrame(moveMarker._raf);
  const step = t => {
    const k = Math.min(1, (t - start) / dur);
    meMarker.setLatLng([from.lat + (to[0] - from.lat) * k, from.lng + (to[1] - from.lng) * k]);
    if (k < 1) moveMarker._raf = requestAnimationFrame(step);
  };
  moveMarker._raf = requestAnimationFrame(step);
}
function fitAll() {
  const pts = [];
  if (state.location) pts.push([state.location.lat, state.location.lng]);
  if (state.destination) pts.push([state.destination.destLat, state.destination.destLng]);
  if (!routeLine && pts.length === 1) return map.setView(pts[0], 14);
  let b = routeLine ? routeLine.getBounds() : null;
  pts.forEach(p => b ? b.extend(p) : (b = L.latLngBounds([p, p])));
  if (b) map.fitBounds(b, { paddingTopLeft: [40, 120], paddingBottomRight: [40, 320] });
}

/* ================= RENDER ================= */
function renderAvatar() {
  if (meMarker) meMarker.setIcon(avatarIcon());
  const s = safeAvatar(state.avatar); if (s) $('avatarPreview').src = s;
}
function renderStatus() {
  const s = state.status, st = STATUSES.find(x => x.text === s);
  $('statusText').textContent = s ? `${st ? st.emoji + ' ' : ''}${s}` : 'รอข้อมูล...';
  document.querySelectorAll('[data-status]').forEach(b => b.classList.toggle('active', b.dataset.status === s));
  renderProgress();
}
function renderLocation() {
  const l = state.location; if (!l) return;
  const pos = [l.lat, l.lng];
  if (!meMarker) meMarker = L.marker(pos, { icon: avatarIcon(), zIndexOffset: 1000 }).addTo(map);
  else moveMarker(pos);
  if (!fitted) { fitted = true; fitAll(); } else if (followMe) map.panTo(pos);
  const spd = l.speed || 0;
  $('speedText').textContent = Math.round(spd);
  if (spd > 15) avgSpeed = avgSpeed ? avgSpeed * 0.8 + spd * 0.2 : spd;
  renderUpdated(); renderProgress();
}
function renderUpdated() {
  const l = state.location, el = $('updatedText');
  if (!l || !l.updatedAt) { el.textContent = 'ยังไม่มีข้อมูลตำแหน่ง'; return; }
  const sec = Math.max(0, Math.round((serverNow() - l.updatedAt) / 1000));
  let txt = sec < 15 ? 'อัปเดตเมื่อสักครู่'
    : sec < 60 ? `อัปเดต ${sec} วินาทีที่แล้ว`
    : sec < 3600 ? `อัปเดต ${Math.floor(sec / 60)} นาทีที่แล้ว`
    : `อัปเดต ${Math.floor(sec / 3600)} ชม. ที่แล้ว`;
  const stale = sec > 180 && state.status !== 'ถึงแล้ว';
  if (stale) txt += ' · สัญญาณอาจขาดหาย';
  el.textContent = txt;
  el.className = 'text-xs ' + (stale ? 'text-amber-500' : 'text-slate-400');
}
setInterval(renderUpdated, 10000);

function renderDestination() {
  const d = state.destination;
  if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
  if (destMarker) { map.removeLayer(destMarker); destMarker = null; }
  routeCum = null;
  if (!d) { $('destText').textContent = 'ยังไม่ได้ตั้งจุดหมาย'; renderProgress(); return; }
  const rc = Array.isArray(d.routeCoords) ? d.routeCoords.filter(p => Array.isArray(p) && p.length === 2) : [];
  d.routeCoords = rc;
  if (rc.length > 1) {
    routeLine = L.polyline(rc, { color: '#6366f1', weight: 6, opacity: .85, lineCap: 'round' }).addTo(map);
    routeCum = buildCum(rc);
  }
  destMarker = L.marker([d.destLat, d.destLng], { icon: destIcon }).addTo(map);
  $('destText').textContent = 'ไป ' + (d.destName || 'จุดหมาย');
  if (state.location) { fitted = true; fitAll(); }
  renderProgress();
}
function renderProgress() {
  const d = state.destination, l = state.location;
  const set = (pct, rem, eta, detail) => {
    $('progressBar').style.width = pct + '%'; $('pctText').textContent = Math.round(pct) + '%';
    $('remainText').textContent = rem; $('etaText').textContent = eta; $('etaDetail').textContent = detail;
  };
  if (!d || !l) return set(0, '-', '-', '');
  if (state.status === 'ถึงแล้ว') return set(100, '0', 'ถึงแล้ว', 'ถึงที่หมายเรียบร้อย');
  const rem = remainingKm([l.lat, l.lng]);
  const total = Math.max(d.totalDistanceKm || 0, rem, 0.1);
  const pct = Math.max(0, Math.min(100, (1 - rem / total) * 100));
  const spd = avgSpeed || FALLBACK_SPEED;
  const mins = Math.round(rem / spd * 60);
  const hhmm = new Date(Date.now() + mins * 60000).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
  const dur = mins < 60 ? `${mins} นาที` : `${Math.floor(mins / 60)} ชม. ${mins % 60} นาที`;
  set(pct, rem < 10 ? rem.toFixed(1) : Math.round(rem), hhmm, `อีกประมาณ ${dur} (ความเร็วเฉลี่ย ${Math.round(spd)} km/h)`);
}

/* ================= STICKERS ================= */
function popSticker(s) {
  const el = document.createElement('div'); el.className = 'sticker-pop';
  const em = document.createElement('div'); em.className = 'text-7xl'; em.textContent = s.emoji;
  const tx = document.createElement('div');
  tx.className = 'mt-2 bg-white/95 rounded-full shadow-lg px-5 py-2 text-lg font-medium text-pink-500 whitespace-nowrap';
  tx.textContent = s.text;
  el.append(em, tx); document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
  if (navigator.vibrate) navigator.vibrate([80, 40, 80]);
}
function buildStickers() {
  const box = $('stickerBtns'); box.innerHTML = '';
  STICKERS.forEach(s => {
    const b = document.createElement('button');
    b.className = 'rounded-2xl bg-pink-50 hover:bg-pink-100 active:scale-95 transition py-2 flex flex-col items-center';
    b.innerHTML = `<span class="text-xl">${s.emoji}</span><span class="text-[11px] text-slate-500 mt-0.5">${s.text}</span>`;
    b.onclick = () => sendSticker(s);
    box.appendChild(b);
  });
}
let lastSticker = 0;
async function sendSticker(s) {
  if (Date.now() - lastSticker < 3000) return toast('ส่งถี่ไปนิด รอแป๊บนะ');
  lastSticker = Date.now();
  try {
    await tripRef.child('sticker').set({ emoji: s.emoji, text: s.text, timestamp: TS });
    toast('ส่งแล้ว!');
  } catch (e) { toast('ส่งไม่สำเร็จ (ตรวจสอบ Firebase Rules)'); }
}

/* ================= REALTIME LISTENERS ================= */
let stickerReady = false;
tripRef.child('avatar').on('value', s => { state.avatar = s.val(); renderAvatar(); });
tripRef.child('status').on('value', s => { state.status = s.val(); renderStatus(); });
tripRef.child('location').on('value', s => { state.location = s.val(); renderLocation(); });
tripRef.child('destination').on('value', s => { state.destination = s.val(); renderDestination(); });
tripRef.child('sticker').on('value', s => {
  const v = s.val();
  if (!stickerReady) { stickerReady = true; return; }
  if (v && v.emoji) popSticker(v);
});

/* ================= UI COMMON ================= */
$('handle').onclick = () => $('sheetBody').classList.toggle('hidden');
function setFollow(on) {
  followMe = on; $('followBtn').textContent = on ? 'ตามหมุด: เปิด' : 'ตามหมุด: ปิด';
  if (on && state.location) map.panTo([state.location.lat, state.location.lng]);
}
$('followBtn').onclick = () => setFollow(!followMe);
map.on('dragstart', () => { if (followMe) setFollow(false); });

$('myLocationBtn').addEventListener('click', () => {
  if (!navigator.geolocation) return toast('เบราว์เซอร์ไม่รองรับ GPS');
  toast('กำลังหาตำแหน่งปัจจุบัน...');
  navigator.geolocation.getCurrentPosition(p => {
    const pt = [p.coords.latitude, p.coords.longitude];
    map.setView(pt, 15);
    toast('แสดงตำแหน่งปัจจุบันแล้ว');
  }, () => toast('กรุณาอนุญาตการเข้าถึง GPS'), { enableHighAccuracy: true, timeout: 10000 });
});

/* ================= DRIVER & AUTOCOMPLETE SEARCH ================= */
async function dw(path, val) {
  try { await tripRef.child(path).set(val); return true; }
  catch (e) { toast('บันทึกไม่สำเร็จ (ตรวจสอบ Firebase Rules)'); return false; }
}
function setBtn(id, on, onText, offText) { const b = $(id); b.textContent = on ? onText : offText; b.classList.toggle('on', on); }

function resizeImage(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = 150, c = document.createElement('canvas'); c.width = c.height = s;
      const m = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}
function getPositionOnce() {
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p => res([p.coords.latitude, p.coords.longitude]), () => res(null),
      { enableHighAccuracy: true, timeout: 8000 });
  });
}

let routing = false;
async function setDestination(lat, lng, name) {
  if (routing) return; routing = true;
  toast('กำลังคำนวณเส้นทาง...', 10000);
  try {
    let start = state.location ? [state.location.lat, state.location.lng] : await getPositionOnce();
    if (!start) start = DEFAULT_CENTER;
    let coords, km;
    try {
      const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${start[1]},${start[0]};${lng},${lat}?overview=full&geometries=geojson`);
      const j = await r.json();
      if (j.code !== 'Ok') throw new Error('no route');
      coords = j.routes[0].geometry.coordinates.map(c => [+c[1].toFixed(5), +c[0].toFixed(5)]);
      km = j.routes[0].distance / 1000;
    } catch (e) {
      coords = [start, [lat, lng]]; km = hav(start, [lat, lng]);
    }
    if (!state.location) await dw('location', { lat: start[0], lng: start[1], speed: 0, updatedAt: TS });
    const ok = await dw('destination', {
      destLat: +lat.toFixed(6), destLng: +lng.toFixed(6), destName: String(name).slice(0, 80),
      totalDistanceKm: +km.toFixed(1), routeCoords: downsample(coords, 400)
    });
    if (ok) toast(`ตั้งจุดหมาย: ${name} (${km.toFixed(1)} กม.)`);
  } finally { routing = false; }
}

/* คาดการณ์สถานที่อัตโนมัติขณะพิมพ์ (Debounce Autocomplete) */
let searchTimer = null;
let searchAbortController = null;

async function performPlaceSearch(query) {
  const resultsBox = $('mapSearchResults');
  if (!query || query.length < 2) {
    resultsBox.replaceChildren();
    return;
  }

  if (searchAbortController) searchAbortController.abort();
  searchAbortController = new AbortController();

  resultsBox.innerHTML = '<div class="px-4 py-3 text-xs text-slate-400">กำลังคาดการณ์สถานที่...</div>';

  try {
    const center = map.getCenter();
    // ให้น้ำหนักผลลัพธ์ใกล้บริเวณที่เปิดแผนที่อยู่ (เช่น ภาคใต้)
    const viewbox = `${center.lng - 1.5},${center.lat + 1.5},${center.lng + 1.5},${center.lat - 1.5}`;
    const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=th&countrycodes=th&viewbox=${viewbox}&q=${encodeURIComponent(query)}`;
    
    const response = await fetch(url, { signal: searchAbortController.signal });
    const places = await response.json();
    resultsBox.replaceChildren();

    if (!places.length) {
      resultsBox.innerHTML = '<div class="px-4 py-3 text-xs text-slate-400">ไม่พบสถานที่ที่ตรงกัน ลองพิมพ์ชื่อจังหวัด/อำเภอเพิ่ม</div>';
      return;
    }

    places.forEach(place => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'map-search-result';
      
      const parts = place.display_name.split(',').map(s => s.trim());
      const shortName = place.name || parts[0];
      const subAddress = parts.slice(1, 4).join(', ');

      button.innerHTML = `
        <span class="text-base mt-0.5 text-indigo-400">&#128205;</span>
        <div class="min-w-0 flex-1">
          <div class="font-medium text-slate-700 truncate">${shortName}</div>
          <div class="text-[11px] text-slate-400 truncate">${subAddress || place.display_name}</div>
        </div>
      `;

      button.addEventListener('click', () => {
        const lat = Number(place.lat), lng = Number(place.lon);
        resultsBox.replaceChildren();
        $('mapSearchInput').value = shortName;
        setDestination(lat, lng, shortName);
      });
      resultsBox.appendChild(button);
    });
  } catch (error) {
    if (error.name !== 'AbortError') {
      resultsBox.innerHTML = '<div class="px-4 py-3 text-xs text-rose-400">ค้นหาไม่สำเร็จ ลองใหม่อีกครั้ง</div>';
    }
  }
}

$('mapSearchInput').addEventListener('input', event => {
  const query = event.target.value.trim();
  $('clearSearchBtn').classList.toggle('hidden', query.length === 0);
  clearTimeout(searchTimer);
  if (query.length < 2) {
    $('mapSearchResults').replaceChildren();
    return;
  }
  searchTimer = setTimeout(() => performPlaceSearch(query), 400);
});

$('clearSearchBtn').addEventListener('click', () => {
  $('mapSearchInput').value = '';
  $('clearSearchBtn').classList.add('hidden');
  $('mapSearchResults').replaceChildren();
  $('mapSearchInput').focus();
});

$('mapSearchForm').addEventListener('submit', event => {
  event.preventDefault();
  clearTimeout(searchTimer);
  performPlaceSearch($('mapSearchInput').value.trim());
});

/* GPS + Wake Lock */
let watchId = null, lastSent = 0, prevFix = null, wakeLock = null;
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) {}
}
function releaseWakeLock() { if (wakeLock) { wakeLock.release(); wakeLock = null; } }

function onFix(p) {
  const t = Date.now(), c = p.coords;
  if (t - lastSent < GPS_INTERVAL_MS) return;
  if (c.accuracy && c.accuracy > 500) return;
  const pos = [c.latitude, c.longitude];
  let kmh = (c.speed != null && !isNaN(c.speed)) ? c.speed * 3.6 : null;
  if (kmh === null && prevFix) { const dt = (t - prevFix.t) / 3600000; if (dt > 0) kmh = hav(prevFix.pos, pos) / dt; }
  prevFix = { pos, t }; lastSent = t;
  dw('location', { lat: +pos[0].toFixed(6), lng: +pos[1].toFixed(6), speed: Math.round(kmh || 0), updatedAt: TS });
}
function startGPS() {
  if (!navigator.geolocation) return toast('อุปกรณ์นี้ไม่รองรับ GPS');
  if (demoTimer) stopDemo();
  lastSent = 0;
  watchId = navigator.geolocation.watchPosition(onFix, err => toast('GPS: ' + err.message),
    { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
  requestWakeLock();
  setBtn('gpsBtn', true, 'หยุดแชร์ GPS', 'เริ่มแชร์ GPS');
  toast('เริ่มแชร์ตำแหน่งแล้ว');
}
function stopGPS() {
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = null; prevFix = null; releaseWakeLock();
  setBtn('gpsBtn', false, 'หยุดแชร์ GPS', 'เริ่มแชร์ GPS');
}

/* Demo simulation */
let demoTimer = null;
async function startDemo() {
  if (watchId !== null) stopGPS();
  const hasRoute = () => state.destination && Array.isArray(state.destination.routeCoords) && state.destination.routeCoords.length > 1;
  if (!hasRoute()) await setDestination(DEMO_DEST.lat, DEMO_DEST.lng, DEMO_DEST.name + ' (เดโม)');
  if (!hasRoute()) return toast('ยังไม่มีเส้นทางให้ทดลองวิ่ง');
  const rc = state.destination.routeCoords, cum = buildCum(rc), total = cum[cum.length - 1];
  const step = total / DEMO_SECONDS;
  let traveled = 0;
  dw('status', 'กำลังเดินทาง');
  requestWakeLock();
  setBtn('demoBtn', true, 'หยุดทดลอง', 'ทดลองวิ่ง');
  demoTimer = setInterval(() => {
    traveled = Math.min(total, traveled + step);
    const p = pointAt(rc, cum, traveled);
    dw('location', { lat: +p[0].toFixed(6), lng: +p[1].toFixed(6), speed: Math.round(70 + Math.random() * 30), updatedAt: TS });
    if (traveled >= total) { stopDemo(); dw('status', 'ถึงแล้ว'); toast('ถึงที่หมายแล้ว'); }
  }, 1000);
}
function stopDemo() {
  clearInterval(demoTimer); demoTimer = null;
  if (watchId === null) releaseWakeLock();
  setBtn('demoBtn', false, 'หยุดทดลอง', 'ทดลองวิ่ง');
}

/* Pick on map */
let pickMode = false;
function updatePick() {
  setBtn('pickBtn', pickMode, 'แตะบนแผนที่ได้เลย (กดเพื่อยกเลิก)', 'แตะแผนที่เพื่อปักจุดหมาย');
  map.getContainer().style.cursor = pickMode ? 'crosshair' : '';
}

function buildStatusBtns() {
  const box = $('statusBtns'); box.innerHTML = '';
  STATUSES.forEach(s => {
    const b = document.createElement('button');
    b.dataset.status = s.text;
    b.className = 'chip rounded-xl bg-slate-100 text-slate-600 py-2 flex flex-col items-center transition';
    b.innerHTML = `<span class="text-lg">${s.emoji}</span><span class="text-xs mt-0.5">${s.text}</span>`;
    b.onclick = () => dw('status', s.text);
    box.appendChild(b);
  });
  renderStatus();
}

let driverBound = false;
function switchMode(isDriver) {
  $('modeBadge').classList.toggle('hidden', !isDriver);
  $('viewerPanel').classList.toggle('hidden', isDriver);
  $('driverPanel').classList.toggle('hidden', !isDriver);
  $('topSearchWrapper').classList.toggle('hidden', !isDriver);

  $('btnDriverMode').className = isDriver ? 'px-3 py-1.5 rounded-full font-medium bg-slate-800 text-white transition' : 'px-3 py-1.5 rounded-full font-medium text-slate-500 transition';
  $('btnViewerMode').className = !isDriver ? 'px-3 py-1.5 rounded-full font-medium bg-slate-800 text-white transition' : 'px-3 py-1.5 rounded-full font-medium text-slate-500 transition';

  if (isDriver && !driverBound) {
    driverBound = true;
    buildStatusBtns();
    $('avatarInput').onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try { const data = await resizeImage(f); if (await dw('avatar', data)) toast('อัปเดตรูปอวตารแล้ว'); }
      catch (err) { toast('อ่านไฟล์รูปไม่ได้'); }
      e.target.value = '';
    };
    $('pickBtn').onclick = () => { pickMode = !pickMode; updatePick(); };
    map.on('click', async e => {
      if (!pickMode) return;
      pickMode = false; updatePick();
      const { lat, lng } = e.latlng;
      let name = 'จุดที่ปักหมุด';
      try {
        const j = await (await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=th&zoom=14&lat=${lat}&lon=${lng}`)).json();
        const a = j.address || {};
        name = j.name || a.village || a.town || a.city || a.county || a.state || (j.display_name || '').split(',')[0] || name;
      } catch (err) {}
      setDestination(lat, lng, name);
    });
    $('clearDestBtn').onclick = () => dw('destination', null);
    $('gpsBtn').onclick = () => watchId !== null ? stopGPS() : startGPS();
    $('demoBtn').onclick = () => demoTimer ? stopDemo() : startDemo();
  }
}

$('btnDriverMode').onclick = () => switchMode(true);
$('btnViewerMode').onclick = () => switchMode(false);
buildStickers();

if (new URLSearchParams(location.search).get('mode') === 'driver') switchMode(true);
else switchMode(false);
</script>

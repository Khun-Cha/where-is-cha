<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Where is Cha? — ติดตามการเดินทาง</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #F8FAFC; margin: 0; padding: 0; }
    #map { height: 100vh; width: 100vw; z-index: 1; }
    .avatar-marker {
      border-radius: 50%; border: 3px solid #ffffff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
      background-size: cover; background-position: center; background-color: #E2E8F0;
    }
    .avatar-pulse {
      position: absolute; width: 100%; height: 100%; border-radius: 50%;
      background: rgba(99, 102, 241, 0.35); animation: pulse 2s infinite; z-index: -1;
    }
    @keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(1.7); opacity: 0; } }
    @keyframes floatUp {
      0% { transform: translateY(20px) scale(0.8); opacity: 0; }
      20% { transform: translateY(0) scale(1.1); opacity: 1; }
      80% { transform: translateY(-10px) scale(1); opacity: 1; }
      100% { transform: translateY(-40px) scale(0.9); opacity: 0; }
    }
    .sticker-toast { animation: floatUp 3.5s ease-in-out forwards; }
  </style>
</head>
<body class="overflow-hidden select-none text-slate-700">

  <div id="map"></div>

  <!-- แถบด้านบน -->
  <div class="fixed top-4 left-4 right-4 z-20 flex flex-col gap-2 pointer-events-none">
    <div class="flex justify-between items-center">
      <div class="bg-white/90 backdrop-blur-md px-4 py-2.5 rounded-2xl shadow-sm border border-slate-100 pointer-events-auto flex items-center gap-2.5">
        <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-slate-300"></span>
        <div>
          <p id="status-text" class="text-xs font-medium text-slate-700">รอเริ่มการเดินทาง</p>
          <p id="last-update" class="text-[10px] text-slate-400">พร้อมเชื่อมต่อฐานข้อมูลแล้ว</p>
        </div>
      </div>

      <div class="bg-white/90 backdrop-blur-md p-1 rounded-2xl shadow-sm border border-slate-100 pointer-events-auto flex text-xs">
        <button id="btn-mode-viewer" onclick="setMode('viewer')" class="px-3 py-1.5 rounded-xl font-medium transition bg-indigo-50 text-indigo-600">👀 โหมดแฟนดู</button>
        <button id="btn-mode-driver" onclick="setMode('driver')" class="px-3 py-1.5 rounded-xl font-medium text-slate-500 transition">🚗 โหมดคนขับ</button>
      </div>
    </div>

    <div id="search-box-container" class="hidden pointer-events-auto max-w-md w-full mx-auto">
      <div class="bg-white/95 backdrop-blur-md rounded-2xl shadow-sm border border-slate-100 p-1.5 flex items-center gap-2">
        <input type="text" id="dest-input" placeholder="พิมพ์จุดหมาย เช่น พัทลุง หรือแตะบนแผนที่..." class="flex-1 bg-transparent text-xs px-3 py-1.5 outline-none text-slate-700" onkeypress="if(event.key==='Enter') searchDestination()" />
        <button onclick="searchDestination()" class="px-3 py-1.5 bg-indigo-500 text-white rounded-xl text-xs font-medium hover:bg-indigo-600 transition">ค้นหา</button>
      </div>
    </div>
  </div>

  <!-- ปุ่มด้านขวา -->
  <div class="fixed top-32 right-4 z-20 flex flex-col gap-2">
    <button onclick="centerMap()" title="โฟกัสตำแหน่ง" class="w-10 h-10 bg-white/90 backdrop-blur-md rounded-2xl shadow-sm border border-slate-100 flex items-center justify-center text-slate-600 hover:bg-slate-50 active:scale-95 transition">🎯</button>
    <button onclick="fitRouteBounds()" title="ดูภาพรวมเส้นทาง" class="w-10 h-10 bg-white/90 backdrop-blur-md rounded-2xl shadow-sm border border-slate-100 flex items-center justify-center text-slate-600 hover:bg-slate-50 active:scale-95 transition">🗺️</button>
    <label for="avatar-upload" title="เปลี่ยนรูปอวตาร" class="w-10 h-10 bg-white/90 backdrop-blur-md rounded-2xl shadow-sm border border-slate-100 flex items-center justify-center text-slate-600 hover:bg-slate-50 active:scale-95 transition cursor-pointer">📷</label>
    <button onclick="clearDestination()" title="ล้างจุดหมาย" class="w-10 h-10 bg-white/90 backdrop-blur-md rounded-2xl shadow-sm border border-slate-100 flex items-center justify-center text-slate-600 hover:bg-slate-50 active:scale-95 transition text-xs">🧹</button>
    <input type="file" id="avatar-upload" accept="image/*" class="hidden" onchange="handleAvatarUpload(event)" />
  </div>

  <div id="sticker-container" class="fixed inset-0 pointer-events-none z-30 flex items-center justify-center"></div>

  <!-- การ์ดควบคุมด้านล่าง -->
  <div class="fixed bottom-5 left-4 right-4 z-20 max-w-md mx-auto">
    <div class="bg-white/95 backdrop-blur-md rounded-3xl p-5 shadow-lg border border-slate-100">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-3">
          <div class="relative">
            <img id="preview-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Cha" alt="Avatar" class="w-12 h-12 rounded-full object-cover border-2 border-indigo-100 bg-slate-100" />
            <label for="avatar-upload" class="absolute -bottom-1 -right-1 bg-indigo-500 text-white w-5 h-5 rounded-full text-[10px] flex items-center justify-center cursor-pointer shadow">✎</label>
          </div>
          <div>
            <h2 class="text-sm font-semibold text-slate-800">คุณชา</h2>
            <p id="dest-label" class="text-xs text-slate-400 truncate max-w-[170px]">ยังไม่ได้ตั้งจุดหมายปลายทาง</p>
          </div>
        </div>
        <div class="text-right bg-slate-50 px-3 py-1.5 rounded-2xl border border-slate-100">
          <span id="speed-display" class="text-lg font-semibold text-indigo-600">0</span>
          <span class="text-[10px] text-slate-400 block -mt-1">km/h</span>
        </div>
      </div>

      <div id="progress-section" class="hidden mb-4 bg-slate-50 p-3 rounded-2xl border border-slate-100">
        <div class="flex justify-between items-center text-xs mb-1.5">
          <span class="font-medium text-indigo-600" id="progress-percent">เดินทางแล้ว 0%</span>
          <span class="text-slate-500 text-[11px]" id="remaining-info">เหลือ 0 กม. (~0 นาที)</span>
        </div>
        <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
          <div id="progress-bar" class="bg-gradient-to-r from-indigo-500 to-emerald-400 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
      </div>

      <div id="driver-controls" class="hidden space-y-2.5">
        <div class="grid grid-cols-3 gap-2 text-xs">
          <button onclick="updateTripStatus('กำลังเดินทาง 🚗')" class="py-2 rounded-xl bg-emerald-50 text-emerald-600 font-medium hover:bg-emerald-100 transition">กำลังขับรถ</button>
          <button onclick="updateTripStatus('แวะพักแป๊บนึง ☕')" class="py-2 rounded-xl bg-amber-50 text-amber-600 font-medium hover:bg-amber-100 transition">แวะพักรถ</button>
          <button onclick="updateTripStatus('ถึงที่หมายแล้ว 🎉')" class="py-2 rounded-xl bg-indigo-50 text-indigo-600 font-medium hover:bg-indigo-100 transition">ถึงแล้ว!</button>
        </div>
        <div class="flex gap-2">
          <button id="btn-share-gps" onclick="toggleTracking()" class="flex-1 py-3 rounded-2xl bg-indigo-500 hover:bg-indigo-600 text-white text-xs font-medium shadow-sm transition">📍 เริ่มแชร์ตำแหน่งสด</button>
          <button onclick="startDemoSimulation()" class="px-3 py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-medium transition">ทดลองวิ่ง</button>
        </div>
      </div>

      <div id="viewer-controls" class="space-y-2">
        <p class="text-[11px] text-slate-400 text-center">ส่งกำลังใจให้คุณชา (เด้งขึ้นหน้าจอทันที)</p>
        <div class="grid grid-cols-4 gap-2">
          <button onclick="sendSticker('❤️', 'คิดถึงนะ!')" class="py-2 rounded-2xl bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-medium transition">❤️ คิดถึง</button>
          <button onclick="sendSticker('🚗💨', 'ขับรถดีๆ นะ')" class="py-2 rounded-2xl bg-sky-50 hover:bg-sky-100 text-sky-600 text-xs font-medium transition">🚗 ขับดีๆ</button>
          <button onclick="sendSticker('☕', 'แวะพักบ้างนะ')" class="py-2 rounded-2xl bg-amber-50 hover:bg-amber-100 text-amber-600 text-xs font-medium transition">☕ พักบ้าง</button>
          <button onclick="sendSticker('🎉', 'ถึงแล้วบอกด้วย')" class="py-2 rounded-2xl bg-emerald-50 hover:bg-emerald-100 text-emerald-600 text-xs font-medium transition">🎉 ถึงแล้วบอก</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBOpV9UvLKSVFySYhuCUeLrIT-8OIHL9fE",
      authDomain: "where-is-cha.firebaseapp.com",
      databaseURL: "https://where-is-cha-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "where-is-cha",
      storageBucket: "where-is-cha.firebasestorage.app",
      messagingSenderId: "1007262654950",
      appId: "1:1007262654950:web:d4bc25cf1b4df5730ab627",
      measurementId: "G-DVTGV1R30Y"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const defaultCoords = [7.1897, 100.5954];
    const map = L.map('map', { zoomControl: false }).setView(defaultCoords, 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19
    }).addTo(map);

    let currentAvatarUrl = localStorage.getItem('custom_avatar') || 'https://api.dicebear.com/7.x/avataaars/svg?seed=Cha';
    document.getElementById('preview-avatar').src = currentAvatarUrl;

    function createAvatarIcon(imgUrl) {
      return L.divIcon({
        className: 'custom-div-icon',
        html: `<div style="position:relative; width:50px; height:50px;"><div class="avatar-pulse"></div><div class="avatar-marker" style="width:50px; height:50px; background-image:url('${imgUrl}');"></div></div>`,
        iconSize: [50, 50], iconAnchor: [25, 25]
      });
    }

    const destIcon = L.divIcon({
      className: 'dest-icon',
      html: `<div style="font-size: 32px; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.25));">🏁</div>`,
      iconSize: [32, 32], iconAnchor: [10, 30]
    });

    let marker = L.marker(defaultCoords, { icon: createAvatarIcon(currentAvatarUrl), zIndexOffset: 1000 }).addTo(map);
    let destMarker = null;
    let plannedRouteLine = L.polyline([], { color: '#94A3B8', weight: 5, opacity: 0.45, dashArray: '8, 8' }).addTo(map);
    let activeRouteLine = L.polyline([], { color: '#6366F1', weight: 5, opacity: 0.85 }).addTo(map);
    let tripData = { destLat: null, destLng: null, destName: '', totalDistanceKm: 0, routeCoords: [] };

    map.on('click', function(e) {
      if (currentMode !== 'driver') return;
      setDestination(e.latlng.lat, e.latlng.lng, `จุดหมาย (${e.latlng.lat.toFixed(3)}, ${e.latlng.lng.toFixed(3)})`);
    });

    async function searchDestination() {
      const query = document.getElementById('dest-input').value.trim();
      if (!query) return;
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=th&limit=1`);
        const data = await res.json();
        if (data && data.length > 0) {
          setDestination(parseFloat(data[0].lat), parseFloat(data[0].lon), data[0].display_name.split(',')[0]);
          document.getElementById('dest-input').value = '';
        } else { alert('ไม่พบสถานที่นี้ ลองแตะจิ้มบนแผนที่ได้เลยค่ะ'); }
      } catch (err) { alert('ค้นหาไม่สำเร็จ'); }
    }

    async function setDestination(destLat, destLng, destName) {
      const cur = marker.getLatLng();
      let routeCoords = [[cur.lat, cur.lng], [destLat, destLng]];
      let totalDistKm = calculateHaversine(cur.lat, cur.lng, destLat, destLng);
      try {
        const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${cur.lng},${cur.lat};${destLng},${destLat}?overview=full&geometries=geojson`);
        const data = await res.json();
        if (data.routes && data.routes.length > 0) {
          totalDistKm = data.routes[0].distance / 1000;
          routeCoords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
        }
      } catch (e) {}
      const meta = { startLat: cur.lat, startLng: cur.lng, destLat, destLng, destName, totalDistanceKm: totalDistKm, routeCoords };
      db.ref('trip/destination').set(meta);
      applyDestinationUI(meta);
      fitRouteBounds();
    }

    function applyDestinationUI(meta) {
      if (!meta || !meta.destLat) {
        if (destMarker) { map.removeLayer(destMarker); destMarker = null; }
        plannedRouteLine.setLatLngs([]);
        document.getElementById('dest-label').innerText = 'ยังไม่ได้ตั้งจุดหมายปลายทาง';
        document.getElementById('progress-section').classList.add('hidden');
        tripData.destLat = null;
        return;
      }
      tripData = meta;
      if (!destMarker) destMarker = L.marker([meta.destLat, meta.destLng], { icon: destIcon }).addTo(map);
      else destMarker.setLatLng([meta.destLat, meta.destLng]);
      if (meta.routeCoords) plannedRouteLine.setLatLngs(meta.routeCoords);
      document.getElementById('dest-label').innerText = `ไป: ${meta.destName}`;
      document.getElementById('progress-section').classList.remove('hidden');
      const cur = marker.getLatLng();
      updateProgressUI(cur.lat, cur.lng);
    }

    function clearDestination() {
      db.ref('trip/destination').remove();
      activeRouteLine.setLatLngs([]);
      applyDestinationUI(null);
    }

    function calculateHaversine(lat1, lon1, lat2, lon2) {
      const R = 6371, dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function updateProgressUI(curLat, curLng) {
      if (!tripData.destLat || !tripData.totalDistanceKm) return;
      const straightRem = calculateHaversine(curLat, curLng, tripData.destLat, tripData.destLng);
      const remKm = Math.min(tripData.totalDistanceKm, straightRem * 1.2);
      let percent = straightRem < 0.15 ? 100 : Math.round(((tripData.totalDistanceKm - remKm) / tripData.totalDistanceKm) * 100);
      percent = Math.max(0, Math.min(100, percent));
      const mins = Math.round((remKm / 65) * 60);
      document.getElementById('progress-percent').innerText = `เดินทางแล้ว ${percent}%`;
      document.getElementById('progress-bar').style.width = `${percent}%`;
      document.getElementById('remaining-info').innerText = percent === 100 ? 'ถึงจุดหมายแล้ว!' : `เหลือ ${remKm.toFixed(1)} กม. (~${mins} นาที)`;
    }

    function handleAvatarUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          canvas.width = 150; canvas.height = 150;
          const ctx = canvas.getContext('2d');
          const minSide = Math.min(img.width, img.height);
          ctx.drawImage(img, (img.width - minSide)/2, (img.height - minSide)/2, minSide, minSide, 0, 0, 150, 150);
          const base64 = canvas.toDataURL('image/jpeg', 0.8);
          localStorage.setItem('custom_avatar', base64);
          document.getElementById('preview-avatar').src = base64;
          marker.setIcon(createAvatarIcon(base64));
          db.ref('trip/avatar').set(base64);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    let watchId = null, wakeLock = null, isTracking = false, traveledPath = [];
    async function requestWakeLock() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }

    function toggleTracking() {
      const btn = document.getElementById('btn-share-gps');
      if (!isTracking) {
        if (!navigator.geolocation) return alert("ไม่รองรับ GPS");
        isTracking = true; requestWakeLock();
        btn.innerText = "⏹ หยุดแชร์ตำแหน่ง"; btn.classList.replace('bg-indigo-500', 'bg-rose-500');
        updateTripStatus('กำลังเดินทาง 🚗');
        watchId = navigator.geolocation.watchPosition(
          (pos) => {
            const speedKmh = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
            updateLocationUI(pos.coords.latitude, pos.coords.longitude, speedKmh, Date.now());
            db.ref('trip/location').set({ lat: pos.coords.latitude, lng: pos.coords.longitude, speed: speedKmh, updatedAt: Date.now() });
          },
          () => alert("กรุณาอนุญาต GPS"), { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
        );
      } else {
        isTracking = false; if (watchId) navigator.geolocation.clearWatch(watchId); if (wakeLock) wakeLock.release();
        btn.innerText = "📍 เริ่มแชร์ตำแหน่งสด"; btn.classList.replace('bg-rose-500', 'bg-indigo-500');
        updateTripStatus('หยุดแชร์ตำแหน่งชั่วคราว');
      }
    }

    function updateLocationUI(lat, lng, speed, timestamp) {
      const pos = [lat, lng];
      marker.setLatLng(pos); traveledPath.push(pos); activeRouteLine.setLatLngs(traveledPath); map.panTo(pos);
      updateProgressUI(lat, lng);
      document.getElementById('speed-display').innerText = speed;
      const t = timestamp ? new Date(timestamp) : new Date();
      document.getElementById('last-update').innerText = `อัปเดตเมื่อ ${t.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
      document.getElementById('status-dot').className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping";
    }

    function updateTripStatus(s) { document.getElementById('status-text').innerText = s; db.ref('trip/status').set(s); }
    function sendSticker(emoji, text) { showStickerToast(emoji, text); db.ref('trip/sticker').set({ emoji, text, timestamp: Date.now() }); }
    function showStickerToast(emoji, text) {
      const el = document.createElement('div');
      el.className = 'sticker-toast bg-white/95 backdrop-blur-md px-6 py-4 rounded-3xl shadow-xl border border-indigo-100 text-center';
      el.innerHTML = `<div class="text-4xl mb-1">${emoji}</div><div class="text-sm font-medium text-slate-700">${text}</div>`;
      document.getElementById('sticker-container').appendChild(el);
      setTimeout(() => el.remove(), 3600);
    }

    db.ref('trip/location').on('value', (s) => { if (s.val() && currentMode === 'viewer') updateLocationUI(s.val().lat, s.val().lng, s.val().speed, s.val().updatedAt); });
    db.ref('trip/destination').on('value', (s) => applyDestinationUI(s.val()));
    db.ref('trip/status').on('value', (s) => { if (s.val()) document.getElementById('status-text').innerText = s.val(); });
    db.ref('trip/avatar').on('value', (s) => { if (s.val()) { document.getElementById('preview-avatar').src = s.val(); marker.setIcon(createAvatarIcon(s.val())); } });
    db.ref('trip/sticker').on('value', (s) => { if (s.val() && (Date.now() - s.val().timestamp < 5000)) showStickerToast(s.val().emoji, s.val().text); });

    let currentMode = 'viewer';
    function setMode(mode) {
      currentMode = mode;
      const isDriver = mode === 'driver';
      document.getElementById('btn-mode-driver').className = isDriver ? "px-3 py-1.5 rounded-xl font-medium transition bg-indigo-50 text-indigo-600" : "px-3 py-1.5 rounded-xl font-medium text-slate-500 transition";
      document.getElementById('btn-mode-viewer').className = !isDriver ? "px-3 py-1.5 rounded-xl font-medium transition bg-indigo-50 text-indigo-600" : "px-3 py-1.5 rounded-xl font-medium text-slate-500 transition";
      document.getElementById('driver-controls').classList.toggle('hidden', !isDriver);
      document.getElementById('search-box-container').classList.toggle('hidden', !isDriver);
      document.getElementById('viewer-controls').classList.toggle('hidden', isDriver);
    }

    function centerMap() { map.panTo(marker.getLatLng()); }
    function fitRouteBounds() {
      if (destMarker) map.fitBounds(new L.featureGroup([marker, destMarker]).getBounds().pad(0.25));
      else centerMap();
    }

    let demoInterval = null;
    function startDemoSimulation() {
      if (demoInterval) { clearInterval(demoInterval); demoInterval = null; return; }
      updateTripStatus('กำลังเดินทาง (โหมดทดลอง) 🚗');
      if (tripData.routeCoords && tripData.routeCoords.length > 2) {
        let step = 0;
        const jump = Math.max(1, Math.floor(tripData.routeCoords.length / 40));
        demoInterval = setInterval(() => {
          if (step >= tripData.routeCoords.length) { clearInterval(demoInterval); demoInterval = null; updateTripStatus('ถึงที่หมายแล้ว 🎉'); return; }
          const [lat, lng] = tripData.routeCoords[step];
          const spd = Math.floor(Math.random() * 20) + 65;
          updateLocationUI(lat, lng, spd, Date.now());
          db.ref('trip/location').set({ lat, lng, speed: spd, updatedAt: Date.now() });
          step += jump;
        }, 1000);
      } else {
        let lat = 7.1897, lng = 100.5954;
        demoInterval = setInterval(() => {
          lat -= 0.0012; lng -= 0.0015;
          const spd = Math.floor(Math.random() * 20) + 65;
          updateLocationUI(lat, lng, spd, Date.now());
          db.ref('trip/location').set({ lat, lng, speed: spd, updatedAt: Date.now() });
        }, 1200);
      }
    }

    if (new URLSearchParams(window.location.search).get('mode') === 'driver') setMode('driver');
  </script>
